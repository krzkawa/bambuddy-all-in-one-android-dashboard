name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Lets the preview step look up which pull requests are still open.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # buildNumber/buildSha become the APK's versionCode and versionName, so
      # Settings on the phone can say which build is installed. run_number only
      # ever goes up, which is what an over-the-top reinstall needs.
      - name: Build debug and release
        run: |
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace \
            -PbuildNumber=${{ github.run_number }} \
            -PbuildSha=${{ github.sha }} \
            -PbuildPr=${{ github.event.pull_request.number }}

      - name: Name the APKs after the run
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/bambuddy-aio-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/bambuddy-aio.apk
          ls -la out
          echo "Build ${{ github.run_number }} ($(echo ${{ github.sha }} | cut -c1-7))" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: bambuddy-aio-apk
          path: out/*.apk
          if-no-files-found: error

      # An artifact downloads as a zip, which is miserable to unpack on an old
      # phone. A release gives the phone's browser a direct link to the APK.
      - name: Publish the APK where a phone can reach it
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=$(echo "${{ github.sha }}" | cut -c1-7)
          notes="Build ${{ github.run_number }} ($short). Download bambuddy-aio.apk straight onto the phone and open it. Settings > Versions on the phone shows the same build number, so you can always tell what is installed."
          gh release view latest >/dev/null 2>&1 \
            || gh release create latest --title "Latest build" --notes "$notes" --prerelease
          gh release edit latest --notes "$notes"
          gh release upload latest out/bambuddy-aio.apk out/bambuddy-aio-debug.apk --clobber

      # The same idea for a branch that has not landed yet. Work now arrives as
      # a pull request, and a pull request nobody can install is a pull request
      # nobody can judge — the whole app is a thing you look at on a phone. The
      # tag is fixed, so the link never changes. Several pull requests are open
      # at once, so each keeps its own file, named by its number, and the notes
      # list which file is which; one pull request's build never replaces
      # another's. Files for pull requests that have since closed are removed.
      - name: Publish a preview APK for a pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          file="bambuddy-aio-pr$PR.apk"
          cp out/bambuddy-aio.apk "out/$file"
          gh release view preview >/dev/null 2>&1 \
            || gh release create preview --title "Preview builds" --notes "Starting up" --prerelease
          gh release upload preview "out/$file" --clobber

          # Anything left over from before files were named by pull request.
          for old in bambuddy-aio.apk bambuddy-aio-debug.apk; do
            gh release delete-asset preview "$old" --yes 2>/dev/null || true
          done

          lines=""
          for asset in $(gh release view preview --json assets --jq '.assets[].name' | grep -E '^bambuddy-aio-pr[0-9]+\.apk$' | sort -V); do
            n=$(echo "$asset" | grep -oE '[0-9]+')
            state=$(gh pr view "$n" --json state --jq .state 2>/dev/null || echo UNKNOWN)
            if [ "$state" != "OPEN" ]; then
              gh release delete-asset preview "$asset" --yes || true
              continue
            fi
            title=$(gh pr view "$n" --json title --jq .title)
            lines="$lines
          - **$asset**: #$n, $title"
          done

          notes="One APK per open pull request. Pick the file with the pull request's number and install it over the top of what you have; Settings > Versions on the phone names the pull request it came from. The main build is still at the \`latest\` tag.
          $lines"
          gh release edit preview --title "Preview builds" --notes "$notes"

  smoke:
    name: Launch on Android 7
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bambuddy-aio-apk
          path: out

      # The emulator needs hardware acceleration to boot in a sane amount of time.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # API 24 is Android 7.0, the oldest version this app supports and the one
      # the phone it is written for runs. The release APK is the one installed
      # here because it is the one he downloads, and it is the only build R8
      # runs over — a keep rule that goes missing breaks that one alone.
      - name: Install and screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          target: default
          arch: x86_64
          profile: Nexus 5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Nothing in here is allowed to fail the job. Whatever happened gets
          # written down, and the next step decides what it means — otherwise a
          # bare "exit code 2" is all that survives, and the logs themselves are
          # not reachable from every environment.
          script: |
            mkdir -p shots
            adb install -r out/bambuddy-aio.apk > shots/install.txt 2>&1 || true
            adb logcat -c || true
            adb shell am start -n io.github.krzkawa.bambuddyaio/.ui.MainActivity > shots/start.txt 2>&1 || true
            sleep 15
            adb exec-out screencap -p > shots/first-run.png || true
            adb logcat -d > shots/logcat.txt 2>&1 || true
            adb shell dumpsys window windows > shots/windows.txt 2>&1 || true
            adb shell dumpsys activity activities > shots/activities.txt 2>&1 || true
            echo done

      - name: Report what happened
        if: always()
        run: |
          crash=$(grep -A 40 "FATAL EXCEPTION" shots/logcat.txt 2>/dev/null | head -60)
          installed=no
          grep -q "^Success" shots/install.txt 2>/dev/null && installed=yes
          running=no
          grep -q "io.github.krzkawa.bambuddyaio" shots/activities.txt 2>/dev/null && running=yes
          {
            echo "## Launch on Android 7"
            echo "### install"
            echo '```'; tail -5 shots/install.txt 2>/dev/null || echo "no output"; echo '```'
            echo "### am start"
            echo '```'; tail -10 shots/start.txt 2>/dev/null || echo "no output"; echo '```'
            echo "installed: $installed, on screen: $running"
            echo "credential storage: $(grep -o 'Credentials are [a-z ]*' shots/logcat.txt 2>/dev/null | tail -1 || echo 'not reported')"
            echo "### crash"
            echo '```'; [ -n "$crash" ] && echo "$crash" || echo "none"; echo '```'
            echo "### app log lines"
            echo '```'
            grep -iE "bambuddyaio|AndroidRuntime|ActivityManager.*bambuddy" shots/logcat.txt 2>/dev/null | tail -30 || echo "none"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$crash" ]; then
            echo "The app crashed on launch."
            exit 1
          fi
          # Without these two the job would pass on an APK that never installed.
          if [ "$installed" != "yes" ]; then
            echo "The APK did not install."
            cat shots/install.txt 2>/dev/null
            exit 1
          fi
          if [ "$running" != "yes" ]; then
            echo "The app installed but is not on screen."
            cat shots/start.txt 2>/dev/null
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
          if-no-files-found: warn
